<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Plot Assist</title>
	</head>
	<body>
		<div id="app">
			<div id="available-channels" class="section">
				<div class="header">
					<input type="text" id="available-channels-search" placeholder="Search Channels ..."></input>
					<p>Available Channels</p>
				</div>

				<div id="available-channels-container">
					<ul id="available-channels-list" class="list">

					</ul>

				</div>
			</div>

			<div id="available-channels-buttons">
				<div>
					<button>&gt&gt</button>
					<button>[&gt&gt]</button>
					<button>&gt</button>
					<button>[&gt]</button>
				</div>

				<div>
					<button>[&lt&gt]</button>
					<button>[&gt&lt]</button>
					<button>↑</button>
					<button>↓</button>
					<button>&lt</button>
					<button>&lt&lt</button>
				</div>
			</div>

			<div id="selected-channels" class="section">
				<div class="header">
					<p>Selected Channels</p>
				</div>
				<ul id="selected-channels-list" class="list">

				</ul>
			</div>

			<div id="filters" class="section">

			</div>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
